# =====================================================================
#  ORDER-FLOW BOT — CONFIG
#  This file is the equivalent of the "input" block at the top of an
#  MQL5 EA. Change numbers here, not in the code.
# =====================================================================

[instrument]
# Order flow is READ from the full-size contract (GC — where the big
# traders are) and EXECUTED on the micro (MGC — 1/10th the size), so a
# small account can follow large players with sane risk.
data_symbol         = "GC.v.0"   # Databento continuous symbol for the flow feed
exec_symbol         = "MGC"      # contract the bot actually trades
tick_size           = 0.10       # gold futures tick
tick_value          = 1.00       # USD per tick per contract (MGC = $1, GC = $10)
commission_per_side = 0.85       # USD per contract per side (broker + exchange, approx)

[session]
# US Eastern time (New York) - daylight saving is handled automatically.
# These are the times prop firms quote their rules in.
day_reset_et   = "18:00"   # CME trading day starts 18:00 ET
trade_start_et = "08:30"   # only open trades in the liquid COMEX hours
trade_end_et   = "15:00"
flatten_et     = "16:00"   # bot closes everything here (set before your firm's cutoff)

[orderflow]
bar_seconds        = 60      # footprint bar length
size_window        = 2000    # prints used for the rolling average print size
large_print_mult   = 6.0     # a print is "large" if size >= mult x average print
large_print_min    = 10      # ...and at least this many contracts
flow_window_sec    = 300     # rolling window for large-print net flow and delta
imbalance_ratio    = 3.0     # diagonal footprint imbalance ratio (3:1)
imbalance_min_vol  = 5       # ignore imbalances on tiny levels
absorption_mult    = 4.0     # heavy aggression at the bar extreme vs avg level volume
absorption_hold    = 3       # ticks the close must hold away from the extreme
atr_bars           = 14

[strategy]
min_net_large          = 40     # net contracts in large prints (buy - sell) inside the window
require_delta_confirm  = true   # bar delta and rolling delta must agree with the big prints
require_structure      = true   # need stacked imbalance OR absorption on the bar
min_stacked            = 3      # stacked imbalance levels
use_vwap_filter        = true   # longs above session VWAP, shorts below
max_vwap_extension_atr = 3.0    # don't chase: skip if price is this many ATRs past VWAP
sl_ticks               = 30     # $3.00 on gold
tp1_ticks              = 30
tp2_ticks              = 60
tp1_fraction           = 0.5    # close half at TP1 (only when >= 2 contracts)
breakeven_offset_ticks = 2      # SL moves to entry + this after TP1 (covers commission)
max_hold_minutes       = 30
flow_reversal_exit     = true   # exit if big flow flips against the position
reversal_frac          = 0.75
cooldown_bars          = 3      # bars to wait after a trade closes

[propfirm]
# ---- Copy these from YOUR firm's rules page for YOUR account size ----
account_size        = 50000
profit_target       = 3000     # evaluation target in $; 0 = funded account (no target)
max_drawdown        = 2000     # firm's max loss / trailing drawdown in $
drawdown_type       = "intraday_trailing"   # "static" | "eod_trailing" | "intraday_trailing"
trail_stops_at_start = true    # trailing floor stops rising at account_size + trail_lock_offset
trail_lock_offset   = 0        # e.g. 100 if the firm locks the floor at start + $100
daily_loss_limit    = 1000     # firm daily loss limit in $; 0 = firm has none
max_contracts_firm  = 50       # firm position cap in the contract you trade (5 minis = 50 micros)
consistency_pct     = 50       # best day must stay under this % (of target in eval); 0 = off
daily_profit_cap    = 0
min_profitable_days = 0        # firm's minimum profitable days to pass (0 = none)
profitable_day_min  = 0        # $ a day must make to count as profitable (check your firm's definition)        # funded accounts: max $ to make in one day; 0 = off
# ---- Bot's own safety margin on top of the firm's rules ----
safety_buffer       = 200      # bot stops this many $ BEFORE any firm limit
bot_daily_stop      = 0        # extra daily stop in $; 0 = use firm limit (or half the drawdown)

[risk]
# profile = "evaluation" (pass fast), "funded" (keep the account, ~2%/month) or "custom"
# A profile overrides the [risk] values below; firm rules above are never changed.
profile                   = "evaluation"
risk_pct_of_room          = 12.0  # risk per trade = this % of the $ room above the drawdown floor
max_contracts             = 10    # bot's own cap
# --- capital protection (ported from Challenge_EA_Protected) ---
use_profit_lock           = true
profit_lock_activate      = 500.0 # $ profit before the lock arms
profit_lock_giveback_pct  = 35.0
profit_lock_pause_hours   = 24.0  # pause after a lock, then resume
relock_buffer             = 250.0 # $ room allowed after resuming
use_streak_cooldown       = true
max_consecutive_losses    = 4
streak_cooldown_hours     = 48.0
use_adaptive_risk         = true
risk_cut_per_loss         = 0.70
min_risk_mult             = 0.33  # adaptive risk never goes below this fraction of normal

[execution]
latency_ms               = 50     # signal -> order arrives at exchange
entry_slippage_ticks     = 1      # market entry pays the spread + a tick
stop_slippage_ticks      = 1
tp_require_trade_through = true   # a resting TP only fills if price trades THROUGH it
